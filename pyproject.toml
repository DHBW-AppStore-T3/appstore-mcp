[project]
name = "appstore-mcp"
version = "0.1.0"
description = "Read-only remote MCP server: staging/prod insight for the DHBW AppStore T3 team"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "cryptography>=44",
    "pyyaml>=6",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
appstore-mcp = "appstore_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
